[package]
name = "chess_web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8" }
leptos_actix = { version = "0.8", optional = true }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
cfg-if = { version = "1.0" }
log = { version = "0.4.19" }
jwt = { version = "0.16.0" }
hmac = { version = "0.12.1" }
sha2 = { version = "0.10.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1" }

# dependecies for client (enable when csr or hydrate set)
# cargo-leptos 0.3 installs the wasm-bindgen-cli matching this crate's locked
# version, unless a wasm-bindgen-cli is installed globally
wasm-bindgen = { version = "0.2", optional = true }
console_log = { version = "1", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3.60", features = [
    "DataTransfer",
    "Document",
    "HtmlDocument",
    "HtmlButtonElement",
    "DomRect",
    "DragEvent",
    "Element",
    "ElementCreationOptions",
    "TouchEvent",
    "TouchList",
    "Touch",
    "NamedNodeMap",
    "Attr",
    "Storage",
    "Window",
    "DomTokenList",
    "Request",
    "RequestInit",
    "EventListener",
    "EventTarget",
] }
js-sys = { version = "0.3.64", optional = true }
env_logger = { version = "0.11", optional = true }

# dependecies for server (enable when ssr set)
actix-files = { version = "0.6", optional = true }
actix-web = { version = "4", features = ["macros"], optional = true }
futures = { version = "0.3", optional = true }
actix-service = { version = "2.0.2", optional = true }
actix = { version = "0.13.0", optional = true }
# Same major as leptos_actix uses, so only one copy is built
actix-ws = { version = "0.3", optional = true }
tokio = { version = "1", features = ["macros", "sync"], optional = true }
uuid = { version = "1.4.0", features = ["v4"], optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:console_log",
    "dep:console_error_panic_hook",
    "dep:js-sys",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_actix",
    "dep:actix-web",
    "dep:actix-files",
    "dep:futures",
    "dep:actix-service",
    "dep:actix",
    "dep:actix-ws",
    "dep:tokio",
    "dep:env_logger",
    "dep:uuid",
]

[package.metadata.cargo-all-features]
denylist = [
    "actix-files",
    "actix-web",
    "console_error_panic_hook",
    "console_log",
    "futures",
    "leptos_actix",
    "wasm-bindgen",
    "actix",
    "actix-ws",
    "tokio",
]
skip_feature_sets = [["ssr", "hydrate"]]

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "chess_web"
# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"
# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"
# The CSS PostCSS builds from src/styles (`npm run build:styles`). cargo-leptos optimizes it
# with Lightning CSS into <site-root>/<site-pkg>/chess_web.css, and live reloads it on changes
style-file = "target/styles/chess_web.css"
# target/ is gitignored, which the watcher skips unless told otherwise
watch-additional-files = ["target/styles"]
# [Optional] Files in the asset-dir will be copied to the site-root directory
assets-dir = "public"
# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3100"
# The port to use for automatic reload monitoring
reload-port = 3001
# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"
# Set by cargo-leptos watch when building with tha tool. Controls whether autoreload JS will be included in the head
watch = false
# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"
# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false
